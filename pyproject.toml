[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forcecode-cli"
version = "8.0.0a2"
description = "A lightweight, dependency-free terminal coding agent for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["ai", "coding-agent", "cli", "terminal", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]

[project.scripts]
forcecode = "forcecode:main"

[tool.setuptools]
py-modules = [
  "forcecode",
  "_forcecode_mission",
  "forcecode_base",
  "forcecode_config",
  "forcecode_stores",
  "forcecode_providers",
  "forcecode_queues",
  "forcecode_workspace",
  "forcecode_sandbox",
  "forcecode_skills",
  "forcecode_mcp",
  "forcecode_context",
]

[tool.unittest]
start-directory = "tests"
