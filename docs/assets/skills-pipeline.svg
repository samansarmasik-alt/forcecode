<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="610" viewBox="0 0 1500 610" role="img" aria-labelledby="title desc">
  <title id="title">ForceCode Agent Skills selection and security pipeline</title>
  <desc id="desc">A project profile uses generic labels to discover skills, then deterministic security and relevance gates allow only standalone SKILL.md text into project scope. Relevant skills and AI-chosen agents receive focused context.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080a12"/><stop offset="1" stop-color="#151229"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#6c6f91"/></marker><style>.s{font-family:Inter,"Segoe UI",Arial,sans-serif}.m{font-family:"Cascadia Code",Consolas,monospace}.h{font-size:19px;font-weight:700;fill:#f1f3ff}.p{font-size:14px;fill:#9da8c3}.k{font-size:12px;font-weight:700;letter-spacing:1.3px}.box{fill:#0e1422;stroke:#35415e;stroke-width:1.5}</style></defs>
  <rect width="1500" height="610" rx="30" fill="url(#bg)"/>
  <text x="65" y="67" class="s" font-size="34" font-weight="800" fill="#f7f8ff">Load expertise progressively—never the whole catalog</text>
  <text x="65" y="102" class="s" font-size="18" fill="#9ba6c0">Skills are selected for the current task. Discovery shares generic labels, not source code, prompts, keys, or local paths.</text>
  <g class="s">
    <g transform="translate(65 178)"><rect class="box" width="230" height="182" rx="20"/><text class="k" x="22" y="33" fill="#62d8fa">PROJECT PROFILE</text><text class="h" x="22" y="72">Generic labels</text><text class="p" x="22" y="103">language · framework</text><text class="p" x="22" y="129">task type · artifact</text><text class="m" x="22" y="161" font-size="13" fill="#77cce3">no project content</text></g>
    <g transform="translate(345 178)"><rect class="box" width="245" height="182" rx="20"/><text class="k" x="22" y="33" fill="#a996ff">DISCOVERY</text><text class="h" x="22" y="72">Built-in + catalog</text><text class="p" x="22" y="103">project contribution score</text><text class="p" x="22" y="129">deduplicate · cooldown</text><text class="m" x="22" y="161" font-size="13" fill="#b9adff">skills.sh candidates</text></g>
    <g transform="translate(640 150)"><rect width="320" height="238" rx="20" fill="#211a24" stroke="#87604d" stroke-width="1.5"/><text class="k" x="24" y="35" fill="#f0c274">SECURITY GATE</text><text class="h" x="24" y="72">Reject by default</text><text class="p" x="24" y="104">prompt injection · credential requests</text><text class="p" x="24" y="130">sandbox / approval bypass · destructive code</text><text class="p" x="24" y="156">scripts · binaries · companion dependencies</text><rect x="24" y="181" width="272" height="34" rx="10" fill="#2e2020"/><text class="m" x="41" y="203" font-size="13" fill="#f0b5a6">security &gt; 80 · relevance ≥ 60</text></g>
    <g transform="translate(1010 178)"><rect width="205" height="182" rx="20" fill="#0d211b" stroke="#3c966e" stroke-width="1.5"/><text class="k" x="22" y="33" fill="#62daa0">PROJECT SCOPE</text><text class="h" x="22" y="72">SKILL.md only</text><text class="p" x="22" y="103">standalone UTF-8 text</text><text class="p" x="22" y="129">view · disable · remove</text><text class="m" x="22" y="161" font-size="13" fill="#76d4a6">.forgecode/skills</text></g>
    <g transform="translate(1265 178)"><rect class="box" width="170" height="182" rx="20"/><text class="k" x="20" y="33" fill="#a996ff">AT RUNTIME</text><text class="h" x="20" y="72">Task match</text><text class="p" x="20" y="103">selected guidance</text><text class="p" x="20" y="129">specialist roles</text><text class="m" x="20" y="161" font-size="13" fill="#b7adf2">small context</text></g>
  </g>
  <g fill="none" stroke="#6c6f91" stroke-width="2.5" marker-end="url(#a)"><path d="M295 269H337"/><path d="M590 269H632"/><path d="M960 269H1002"/><path d="M1215 269H1257"/></g>
  <g class="s"><rect x="244" y="443" width="1012" height="82" rx="18" fill="#101625" stroke="#303d59"/><text x="270" y="475" class="h" font-size="17">Built-in coverage</text><text x="270" y="503" class="p">root-cause debugging · frontend quality · project audit · release · C++ · .NET · Java JAR · Paper plugin · safe discovery</text></g>
  <text x="750" y="568" text-anchor="middle" class="m" font-size="15" fill="#8894b1">/skills · /skill show · /skill scout · /agents ai · /delegate · /team</text>
</svg>
