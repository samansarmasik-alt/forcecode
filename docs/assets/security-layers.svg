<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b15"/><stop offset="1" stop-color="#17142e"/></linearGradient><linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66ddff"/><stop offset=".5" stop-color="#9f82ff"/><stop offset="1" stop-color="#62efaa"/></linearGradient></defs><rect width="1400" height="620" rx="28" fill="url(#bg)"/><text x="70" y="70" fill="#f4f6ff" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">Safety is part of the architecture</text><text x="70" y="106" fill="#9ba7c7" font-family="Inter,Segoe UI,sans-serif" font-size="19">The model works in an isolated copy—not directly across your machine.</text><g transform="translate(120 170)"><path d="M250 0l190 70v145c0 125-79 206-190 255C139 421 60 340 60 215V70z" fill="#0f1728" stroke="url(#shield)" stroke-width="5"/><text x="250" y="120" text-anchor="middle" fill="#eef2ff" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="700">ForceSandbox</text><text x="250" y="160" text-anchor="middle" fill="#a3b0d1" font-family="Inter,Segoe UI,sans-serif" font-size="18">private project workspace</text><rect x="126" y="205" width="248" height="54" rx="15" fill="#111f2e" stroke="#3e8cab"/><text x="250" y="239" text-anchor="middle" fill="#77dcff" font-family="Inter,Segoe UI,sans-serif" font-size="18">isolated command process</text><rect x="126" y="278" width="248" height="54" rx="15" fill="#19172f" stroke="#735bd0"/><text x="250" y="312" text-anchor="middle" fill="#c3b7ff" font-family="Inter,Segoe UI,sans-serif" font-size="18">snapshots + rollback</text><rect x="126" y="351" width="248" height="54" rx="15" fill="#10271f" stroke="#3b9b70"/><text x="250" y="385" text-anchor="middle" fill="#7aefb3" font-family="Inter,Segoe UI,sans-serif" font-size="18">verified transfer only</text></g><g font-family="Inter,Segoe UI,sans-serif"><g transform="translate(700 168)"><rect width="570" height="82" rx="20" fill="#11182a" stroke="#44557e"/><text x="34" y="34" fill="#eef2ff" font-size="20" font-weight="700">1. Project boundaries</text><text x="34" y="61" fill="#9da9c9" font-size="16">Traversal, links, reparse points, and outside paths are rejected.</text></g><g transform="translate(700 270)"><rect width="570" height="82" rx="20" fill="#11182a" stroke="#44557e"/><text x="34" y="34" fill="#eef2ff" font-size="20" font-weight="700">2. Command isolation</text><text x="34" y="61" fill="#9da9c9" font-size="16">Native AppContainer on Windows; Docker or Podman where available.</text></g><g transform="translate(700 372)"><rect width="570" height="82" rx="20" fill="#11182a" stroke="#44557e"/><text x="34" y="34" fill="#eef2ff" font-size="20" font-weight="700">3. Approval controls</text><text x="34" y="61" fill="#9da9c9" font-size="16">Manual confirmation, Smart Autopilot, or explicit full autopilot.</text></g><g transform="translate(700 474)"><rect width="570" height="82" rx="20" fill="#0e211b" stroke="#3f9d73"/><text x="34" y="34" fill="#79efb4" font-size="20" font-weight="700">4. Evidence before transfer</text><text x="34" y="61" fill="#a7c8b9" font-size="16">Failed checks or real-file conflicts keep changes inside the sandbox.</text></g></g></svg>