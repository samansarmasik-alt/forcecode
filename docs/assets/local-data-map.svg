<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">ForceCode local data and privacy map</title>
  <desc id="desc">User-wide settings, project-local operational state, isolated sandbox copies, and the configured inference provider have distinct boundaries. Only selected prompt context reaches the provider.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070a11"/><stop offset="1" stop-color="#0a1a18"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#657590"/></marker><style>.s{font-family:Inter,"Segoe UI",Arial,sans-serif}.m{font-family:"Cascadia Code",Consolas,monospace}.h{font-size:20px;font-weight:700;fill:#f1f4ff}.p{font-size:14px;fill:#9ba8c4}.k{font-size:12px;font-weight:700;letter-spacing:1.4px}.box{fill:#0d1421;stroke:#34425e;stroke-width:1.5}</style></defs>
  <rect width="1500" height="620" rx="30" fill="url(#bg)"/>
  <text x="65" y="68" class="s" font-size="34" font-weight="800" fill="#f7f8ff">Local state is separated by purpose</text>
  <text x="65" y="103" class="s" font-size="18" fill="#99a6c0">ForceCode does not need a cloud account. Your configured inference provider receives only the request and selected context needed to answer.</text>
  <g class="s">
    <rect x="65" y="166" width="355" height="320" rx="22" class="box"/><text x="93" y="202" class="k" fill="#62d8fa">USER-WIDE · APPDATA</text><text x="93" y="240" class="h">%LOCALAPPDATA%\ForgeCode</text>
    <text x="93" y="278" class="p">config.json · saved keys · profiles</text><text x="93" y="308" class="p">usage.jsonl · crash.log</text><text x="93" y="338" class="p">user memory · installed skills</text><text x="93" y="368" class="p">global launcher + runtime</text>
    <rect x="93" y="405" width="195" height="34" rx="10" fill="#102536"/><text x="108" y="427" class="m" font-size="13" fill="#78d6ed">never commit this folder</text>

    <rect x="465" y="166" width="355" height="320" rx="22" class="box"/><text x="493" y="202" class="k" fill="#a996ff">PROJECT-LOCAL</text><text x="493" y="240" class="h">Repository state</text>
    <text x="493" y="278" class="p">.forgecode · tasks, receipts, logs</text><text x="493" y="308" class="p">.force · context memory layers</text><text x="493" y="338" class="p">.code-review-graph · optional index</text><text x="493" y="368" class="p">.mcp.json · secret-free server metadata</text>
    <rect x="493" y="405" width="190" height="34" rx="10" fill="#211a39"/><text x="508" y="427" class="m" font-size="13" fill="#b9adff">ignored operational data</text>

    <rect x="865" y="166" width="250" height="320" rx="22" fill="#0d211b" stroke="#3d9870" stroke-width="1.5"/><text x="893" y="202" class="k" fill="#62dca2">FORCESANDBOX</text><text x="893" y="240" class="h">Private copy</text>
    <text x="893" y="278" class="p">sanitized environment</text><text x="893" y="308" class="p">project-only tools</text><text x="893" y="338" class="p">snapshots + logs</text><text x="893" y="368" class="p">verified transfer gate</text>
    <rect x="893" y="405" width="150" height="34" rx="10" fill="#123126"/><text x="908" y="427" class="m" font-size="13" fill="#7bd5a8">isolated workspace</text>

    <rect x="1190" y="216" width="245" height="220" rx="22" fill="#211c18" stroke="#8f6c3c" stroke-width="1.5"/><text x="1218" y="252" class="k" fill="#efc373">CONFIGURED PROVIDER</text><text x="1218" y="290" class="h">Inference only</text><text x="1218" y="328" class="p">current request</text><text x="1218" y="356" class="p">selected context + tools</text><text x="1218" y="384" class="p">no local state directory</text>
  </g>
  <g fill="none" stroke="#657590" stroke-width="2.5" marker-end="url(#a)"><path d="M420 326H457"/><path d="M820 326H857"/><path d="M1115 326H1182"/></g>
  <text x="750" y="553" text-anchor="middle" class="m" font-size="16" fill="#8b98b5">For fully local inference, select Ollama or LM Studio · memory can be viewed, edited, deleted, or disabled</text>
</svg>
