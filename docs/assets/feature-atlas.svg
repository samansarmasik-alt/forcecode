<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">ForceCode capability atlas</title>
  <desc id="desc">Twelve product-specific capability cards covering providers, routing, planning, context, graph and MCP intelligence, sandboxing, autonomy, agents, toolchains, terminal control, and evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070a11"/><stop offset=".58" stop-color="#0b1020"/><stop offset="1" stop-color="#091714"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ddcff"/><stop offset=".5" stop-color="#9b83ff"/><stop offset="1" stop-color="#5ee8a4"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <style>
      .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}
      .card{fill:#0d1320;stroke:#293551;stroke-width:1.5}.n{font-size:13px;font-weight:700;letter-spacing:2px;fill:#6d7896}
      .h{font-size:23px;font-weight:700;fill:#f1f4ff}.p{font-size:15px;fill:#9ca8c5}.cmd{font-size:14px;fill:#d6def3}
    </style>
  </defs>
  <rect width="1600" height="940" rx="30" fill="url(#bg)"/>
  <rect x="56" y="52" width="1488" height="5" rx="2.5" fill="url(#rail)"/>
  <text x="70" y="112" class="sans" font-size="36" font-weight="800" fill="#f7f8ff">One CLI, twelve coordinated systems</text>
  <text x="70" y="149" class="sans" font-size="18" fill="#9ca7c2">Each module has a narrow responsibility. ForceCode composes them into one verified engineering loop.</text>

  <g filter="url(#shadow)" class="sans">
    <g transform="translate(70 196)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">01 · MODEL CONTROL</text><text class="h" x="24" y="69">22+ providers</text><text class="p" x="24" y="101">Hosted, local, and custom endpoints</text><text class="p" x="24" y="127">Live model scan · pricing · latency</text><rect x="24" y="148" width="160" height="27" rx="8" fill="#102435"/><text class="cmd" x="36" y="167">/providers  /model</text></g>
    <g transform="translate(441 196)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">02 · TRANSPORT</text><text class="h" x="24" y="69">Exact API routing</text><text class="p" x="24" y="101">OpenAI · Anthropic · raw protocol off</text><text class="p" x="24" y="127">Profiles · auth detection · failover</text><rect x="24" y="148" width="182" height="27" rx="8" fill="#102435"/><text class="cmd" x="36" y="167">/connect  /route  /protocol</text></g>
    <g transform="translate(812 196)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">03 · SEQUENCING</text><text class="h" x="24" y="69">ForceFlow</text><text class="p" x="24" y="101">Ordered tasks with acceptance gates</text><text class="p" x="24" y="127">Repair before advancing · crash recovery</text><rect x="24" y="148" width="166" height="27" rx="8" fill="#211a39"/><text class="cmd" x="36" y="167">plan → run → verify</text></g>
    <g transform="translate(1183 196)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">04 · EXECUTION</text><text class="h" x="24" y="69">Execution Kernel</text><text class="p" x="24" y="101">Plan · debug · validation · confidence</text><text class="p" x="24" y="127">Public evidence, never hidden reasoning</text><rect x="24" y="148" width="204" height="27" rx="8" fill="#211a39"/><text class="cmd" x="36" y="167">/plan  /debug  /confidence</text></g>

    <g transform="translate(70 410)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">05 · MEMORY</text><text class="h" x="24" y="69">ForceContext</text><text class="p" x="24" y="101">User · project · session memory</text><text class="p" x="24" y="127">Relevance filter · token budget · receipt</text><rect x="24" y="148" width="170" height="27" rx="8" fill="#102435"/><text class="cmd" x="36" y="167">local .force storage</text></g>
    <g transform="translate(441 410)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">06 · CODE INTELLIGENCE</text><text class="h" x="24" y="69">ForceGraph ↔ MCP</text><text class="p" x="24" y="101">Structural graph or external MCP tools</text><text class="p" x="24" y="127">One active backend · instant switch</text><rect x="24" y="148" width="126" height="27" rx="8" fill="#172d27"/><text class="cmd" x="36" y="167">/graph  /mcp</text></g>
    <g transform="translate(812 410)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">07 · ISOLATION</text><text class="h" x="24" y="69">ForceSandbox</text><text class="p" x="24" y="101">Private copy · sanitized environment</text><text class="p" x="24" y="127">Snapshot · conflict-safe transfer</text><rect x="24" y="148" width="116" height="27" rx="8" fill="#172d27"/><text class="cmd" x="36" y="167">/sandbox</text></g>
    <g transform="translate(1183 410)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">08 · AUTONOMY</text><text class="h" x="24" y="69">Smart + VibeCode</text><text class="p" x="24" y="101">Risk-aware approvals · long sessions</text><text class="p" x="24" y="127">Checkpoints · retries · final review</text><rect x="24" y="148" width="178" height="27" rx="8" fill="#382817"/><text class="cmd" x="36" y="167">/autopilot  /vibe</text></g>

    <g transform="translate(70 624)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">09 · SPECIALISTS</text><text class="h" x="24" y="69">Agents + Skills</text><text class="p" x="24" y="101">AI-selected roles · parallel research</text><text class="p" x="24" y="127">Scoped SKILL.md · audited discovery</text><rect x="24" y="148" width="164" height="27" rx="8" fill="#211a39"/><text class="cmd" x="36" y="167">/agents  /skills</text></g>
    <g transform="translate(441 624)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">10 · BUILD SYSTEMS</text><text class="h" x="24" y="69">Native toolchains</text><text class="p" x="24" y="101">Python · JS · C++ · .NET · Java</text><text class="p" x="24" y="127">Rust · Go · Paper plugin packaging</text><rect x="24" y="148" width="206" height="27" rx="8" fill="#102435"/><text class="cmd" x="36" y="167">build · test · artifact proof</text></g>
    <g transform="translate(812 624)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">11 · LIVE CONTROL</text><text class="h" x="24" y="69">Interactive terminal</text><text class="p" x="24" y="101">Streaming · steer-now · queued follow-up</text><text class="p" x="24" y="127">Ctrl+C with continuation memory</text><rect x="24" y="148" width="160" height="27" rx="8" fill="#382817"/><text class="cmd" x="36" y="167">/queue  /stream</text></g>
    <g transform="translate(1183 624)"><rect class="card" width="345" height="190" rx="18"/><text class="n" x="24" y="32">12 · PROOF</text><text class="h" x="24" y="69">Receipts + diagnostics</text><text class="p" x="24" y="101">Tests · artifacts · hashes · confidence</text><text class="p" x="24" y="127">Usage · cost · errors · local logs</text><rect x="24" y="148" width="198" height="27" rx="8" fill="#172d27"/><text class="cmd" x="36" y="167">/status  /usage  /diagnostics</text></g>
  </g>
  <text x="800" y="882" text-anchor="middle" class="mono" font-size="17" fill="#8995b2">your model → selected context → controlled tools → deterministic evidence → verified result</text>
</svg>
