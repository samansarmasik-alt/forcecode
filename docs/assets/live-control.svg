<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">ForceCode live terminal control</title>
  <desc id="desc">A running streamed request can receive immediate steering, a queued follow-up, interactive process input, or a Ctrl+C interruption that preserves a compact continuation summary.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070a11"/><stop offset="1" stop-color="#10182a"/></linearGradient><style>.s{font-family:Inter,"Segoe UI",Arial,sans-serif}.m{font-family:"Cascadia Code",Consolas,monospace}.p{font-size:15px;fill:#9ba8c5}.line{font-size:17px}.tag{font-size:12px;font-weight:700;letter-spacing:1.2px}</style></defs>
  <rect width="1500" height="620" rx="30" fill="url(#bg)"/>
  <text x="65" y="67" class="s" font-size="34" font-weight="800" fill="#f7f8ff">The terminal stays interactive while the model works</text>
  <text x="65" y="102" class="s" font-size="18" fill="#99a5c0">Streaming is output. Steering, queues, process input, and interruption are separate deterministic controls.</text>
  <g transform="translate(65 145)">
    <rect width="875" height="402" rx="20" fill="#090d15" stroke="#34415e" stroke-width="1.5"/>
    <rect width="875" height="46" rx="20" fill="#111827"/><rect y="27" width="875" height="19" fill="#111827"/>
    <circle cx="25" cy="23" r="6" fill="#ff6b6b"/><circle cx="47" cy="23" r="6" fill="#f2c66d"/><circle cx="69" cy="23" r="6" fill="#62dda1"/>
    <text x="438" y="29" text-anchor="middle" class="m" font-size="13" fill="#7985a3">FORCECODE · LIVE REQUEST</text>
    <g class="m line"><text x="30" y="88" fill="#67ddff">you ›</text><text x="104" y="88" fill="#e7ebf7">refactor auth and run focused tests</text>
      <text x="30" y="132" fill="#9f8cff">↳ 00:00</text><text x="128" y="132" fill="#a8b3cb">planning · evidence checklist ready</text>
      <text x="30" y="172" fill="#9f8cff">↳ 00:04</text><text x="128" y="172" fill="#a8b3cb">live response · first chunk received</text>
      <text x="30" y="216" fill="#f0c575">you [steer] ›</text><text x="190" y="216" fill="#f0e1c1">keep the public API backward compatible</text>
      <text x="30" y="260" fill="#9f8cff">↳ 00:07</text><text x="128" y="260" fill="#a8b3cb">current request redirected with visible progress</text>
      <text x="30" y="304" fill="#63e2a2">process ›</text><text x="144" y="304" fill="#d5e7df">test prompt detected · stdin supplied · exit 0</text>
      <text x="30" y="348" fill="#63e2a2">verify  ✓</text><text x="144" y="348" fill="#d5e7df">18 tests passed · artifact unchanged</text>
      <rect x="24" y="370" width="827" height="2" fill="#1c283c"/><text x="30" y="393" font-size="13" fill="#77849f">HAZIR · MOD build · DÜŞÜN high · VERİM balanced · WEB auto</text>
    </g>
  </g>
  <g transform="translate(990 145)" class="s">
    <g><rect width="445" height="82" rx="17" fill="#101d2a" stroke="#347d99"/><text x="24" y="31" class="tag" fill="#63d9f6">ENTER WHILE RUNNING</text><text x="24" y="59" class="p" fill="#d6eaf0">Steer now with visible partial context</text></g>
    <g transform="translate(0 102)"><rect width="445" height="82" rx="17" fill="#17152b" stroke="#6858b6"/><text x="24" y="31" class="tag" fill="#a996ff">/QUEUE MESSAGE</text><text x="24" y="59" class="p" fill="#e0dbf6">Finish current work, then run follow-up</text></g>
    <g transform="translate(0 204)"><rect width="445" height="82" rx="17" fill="#10251e" stroke="#3a916a"/><text x="24" y="31" class="tag" fill="#61d89e">PROCESS INPUT</text><text x="24" y="59" class="p" fill="#d8eee4">Answer prompts and inspect fresh output</text></g>
    <g transform="translate(0 306)"><rect width="445" height="96" rx="17" fill="#2a2116" stroke="#9b7136"/><text x="24" y="31" class="tag" fill="#f0c473">CTRL+C</text><text x="24" y="58" class="p" fill="#efe2cb">Stop without forgetting why or where</text><text x="24" y="80" class="m" font-size="13" fill="#c4aa7b">compact continuation → next prompt</text></g>
  </g>
</svg>
